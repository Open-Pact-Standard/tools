# SPDX-License-Identifier: OPL-1.3.1
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install pytest pytest-cov

      - name: Run unit tests
        run: python -m pytest tests/ -v --ignore=tests/test_integration.py

      - name: Run integration tests
        run: python -m pytest tests/test_integration.py -v

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v             --cov=tools             --cov-report=term-missing             --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check syntax
        run: |
          python -m py_compile tools/opl_spdx_inject.py
          python -m py_compile tools/opl_check.py
          python -m py_compile tools/opl_init.py
          python -m py_compile tools/opl_registry_gen.py
          python -m py_compile tools/opl_migrate.py
          python -m py_compile tools/opl_x402.py


      - name: Verify version consistency
        run: python scripts/check_version.py

      - name: Verify SPDX headers
        run: python tools/opl_spdx_inject.py tools/ --check
