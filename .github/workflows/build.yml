# SPDX-License-Identifier: OPL-1.3.1
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs of this workflow on the same ref for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default
permissions:
  contents: read

jobs:
  build:
    name: build & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: List build artifacts
        run: ls -lh dist/

      # --- Test that the BUILT artifacts install cleanly (not just source) ---
      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Install built sdist (source-only) then add test deps
        run: |
          python -m pip install --force-reinstall --no-binary=:all: dist/*.tar.gz
          python -m pip install pytest pytest-cov ruff

      - name: Verify console scripts are installed and importable
        run: |
          set +e  # don't abort the loop if a script's --help returns non-zero
          for cmd in opl-check opl-init opl-migrate opl-registry-gen opl-spdx-inject opl-x402; do
            command -v "$cmd" >/dev/null 2>&1 || { echo "✗ MISSING console script: $cmd"; exit 1; }
            if "$cmd" --help >/dev/null 2>&1; then
              echo "✓ $cmd (--help ok) at $(command -v $cmd)"
            else
              echo "✓ $cmd (no --help, but on PATH) at $(command -v $cmd)"
            fi
          done

      - name: Run test suite with coverage
        run: pytest

      - name: Run ruff lint
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
