# SPDX-License-Identifier: OPL-1.3.1
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opl-tools"
dynamic = ["version"]
description = "Open-Pact Standard Adoption Tools — free, open-source tools for configuring, validating, and managing OPL-licensed repositories"
readme = "README.md"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
authors = [
    { name = "Open-Pact Standard" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
opl-check        = "tools.opl_check:main"
opl-init         = "tools.opl_init:main"
opl-migrate      = "tools.opl_migrate:main"
opl-registry-gen = "tools.opl_registry_gen:main"
opl-spdx-inject  = "tools.opl_spdx_inject:main"
opl-x402         = "tools.opl_x402:main"

[project.urls]
Homepage = "https://github.com/Open-Pact-Standard/tools"
Repository = "https://github.com/Open-Pact-Standard/tools"
Issues = "https://github.com/Open-Pact-Standard/tools/issues"

# --------------------------------------------------------------------------- #
#  Single source of truth for version (read from tools/_version.py)
# --------------------------------------------------------------------------- #

[tool.setuptools.dynamic]
version = { attr = "tools._version.__version__" }

# --------------------------------------------------------------------------- #
#  Packaging — `tools` package only; include data files & py.typed marker
# --------------------------------------------------------------------------- #

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.setuptools.package-data]
tools = ["*.html", "py.typed"]

# --------------------------------------------------------------------------- #
#  Pytest
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=tools",
    "--cov-report=term-missing",
]

# --------------------------------------------------------------------------- #
#  Coverage
# --------------------------------------------------------------------------- #

[tool.coverage.run]
source = ["tools"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70

# --------------------------------------------------------------------------- #
#  Ruff
# --------------------------------------------------------------------------- #

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]